<!DOCTYPE html>
<html lang="sk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>PZF Explorer</title>
  <base href="../">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pzf-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    window.PZF_ADM = true;
    window.PZF_UMAMI_WEBSITE_ID = '3f350104-b87f-4647-b5cd-6a870702a2a3';
  </script>
  <script>
    (function loadUmami() {
      var id = window.PZF_UMAMI_WEBSITE_ID;
      if (!id || id.length < 8) return;
      var host = location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') return;
      try {
        var q = new URLSearchParams(location.search);
        if (q.get('umami') === 'off') {
          localStorage.setItem('umami.disabled', '1');
          document.cookie = 'umami.disabled=1;path=/;max-age=315360000;secure;samesite=lax';
          location.replace(new URL('optout.html', document.baseURI).href);
          return;
        }
        if (q.get('umami') === 'on') {
          localStorage.removeItem('umami.disabled');
          document.cookie = 'umami.disabled=;path=/;max-age=0';
        }
        if (localStorage.getItem('umami.disabled')) return;
        if (/(?:^|;\s*)umami\.disabled=1/.test(document.cookie)) return;
      } catch (e) {}
      var s = document.createElement('script');
      s.defer = true;
      s.src = 'https://cloud.umami.is/script.js';
      s.setAttribute('data-website-id', id);
      s.setAttribute('data-domains', 'solexecution.github.io');
      document.head.appendChild(s);
    })();
  </script>
</head>
<body class="landing-mode adm">
<div id="boot-overlay">
  <div class="boot-card">
    <div class="boot-logo">PZF Explorer</div>
    <p id="boot-msg">Načítavam…</p>
  </div>
</div>
<script type="module">
  try {
    const res = await fetch(new URL('index.html', document.baseURI));
    if (!res.ok) throw new Error('index.html ' + res.status);
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const incoming = document.importNode(doc.body, true);
    incoming.querySelectorAll('script').forEach((s) => s.remove());
    incoming.classList.add('adm');
    document.body.replaceWith(incoming);
    document.body.classList.add('adm');
    await import(new URL('app.js', document.baseURI).href);
  } catch (e) {
    const msg = document.getElementById('boot-msg');
    if (msg) msg.textContent = 'Chyba načítania: ' + (e && e.message ? e.message : e);
    console.error(e);
  }
</script>
</body>
</html>
